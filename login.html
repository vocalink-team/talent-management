<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOCALINK Talent Management - ログイン</title><link rel="stylesheet" href="style.css"></head><body><main style="margin:0 auto;max-width:520px;padding:12vh 20px;width:100%"><section><small>VOCALINK TALENT MANAGEMENT</small><h1>運営ログイン</h1><p>メールアドレスとパスワードでログインしてください。</p>
<form id="auth-form"><label>メールアドレス<input id="email" type="email" required autocomplete="email" style="display:block;width:100%;padding:12px;margin:8px 0 16px;border:1px solid #e8e1d8;border-radius:10px"></label><label>パスワード<input id="password" type="password" required minlength="6" autocomplete="current-password" style="display:block;width:100%;padding:12px;margin:8px 0 16px;border:1px solid #e8e1d8;border-radius:10px"></label><label id="name-wrap" hidden>表示名<input id="display-name" type="text" autocomplete="name" style="display:block;width:100%;padding:12px;margin:8px 0 16px;border:1px solid #e8e1d8;border-radius:10px"></label><button id="submit" type="submit" style="width:100%">ログイン</button></form><button id="toggle" style="margin-top:10px;background:#eee6dc;color:#5b4b3e;width:100%">新規登録に切り替え</button><p id="message" role="alert"></p></section></main><script type="module" src="auth.js"></script></body></html>
